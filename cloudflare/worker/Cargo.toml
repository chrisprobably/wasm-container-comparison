[package]
name = "calendar-api-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8.7", features = ["tokio-postgres"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["js", "with-chrono-0_4"] }
sea-query = { version = "1.0.2", default-features = false, features = ["derive", "backend-postgres", "with-chrono"] }
sea-query-postgres = { version = "0.6.1", features = ["with-chrono"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
